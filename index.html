<!DOCTYPE html>
<html lang="ru" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PharmaGate AccessForge Studio</title>
    
    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Промышленный фармацевтический EDI/DBF шлюз, конструктор MS Access и валидатор ФЛК">
    <meta property="og:title" content="PharmaGate AccessForge Studio">
    <meta property="og:description" content="Промышленный фармацевтический EDI/DBF шлюз, конструктор MS Access и валидатор ФЛК">

    <!-- Внешние библиотеки (CDN с fallback защитой) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pharma: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --win-bg: rgba(11, 15, 25, 0.96);
            --win-border: rgba(51, 65, 85, 0.85);
            --win-header: linear-gradient(180deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
            --accent-glow: rgba(59, 130, 246, 0.25);
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-drag: none;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace !important;
        }

        /* 🌌 Обои рабочего стола WebOS */
        .desktop-canvas {
            background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0f172a 45%, #020617 100%);
            background-size: cover;
            background-position: center;
        }

        /* 🪟 Оконная система WebOS (Acrylic / Glassmorphism) */
        .os-window {
            position: absolute;
            display: flex;
            flex-direction: column;
            background: var(--win-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--win-border);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.07);
            min-width: 340px;
            min-height: 220px;
            touch-action: none;
        }

        .os-window.active-window {
            border-color: rgba(59, 130, 246, 0.85);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 20px var(--accent-glow);
        }

        .os-window.minimized {
            display: none !important;
        }

        .os-window.maximized {
            top: 6px !important;
            left: 6px !important;
            width: calc(100vw - 12px) !important;
            height: calc(100vh - 60px) !important;
            border-radius: 8px;
        }

        /* 🖱️ Заголовок окна */
        .win-header {
            cursor: move;
            background: var(--win-header);
            border-bottom: 1px solid rgba(51, 65, 85, 0.7);
            touch-action: none;
        }

        /* 8-Позиционные ручки изменения размера */
        .win-resizer {
            position: absolute;
            z-index: 50;
        }
        .resizer-r { top: 0; right: 0; width: 6px; height: 100%; cursor: ew-resize; }
        .resizer-l { top: 0; left: 0; width: 6px; height: 100%; cursor: ew-resize; }
        .resizer-b { bottom: 0; left: 0; width: 100%; height: 6px; cursor: ns-resize; }
        .resizer-t { top: 0; left: 0; width: 100%; height: 6px; cursor: ns-resize; }
        .resizer-rb { bottom: 0; right: 0; width: 14px; height: 14px; cursor: nwse-resize; z-index: 51; }
        .resizer-lb { bottom: 0; left: 0; width: 14px; height: 14px; cursor: nesw-resize; z-index: 51; }
        .resizer-rt { top: 0; right: 0; width: 14px; height: 14px; cursor: nesw-resize; z-index: 51; }
        .resizer-lt { top: 0; left: 0; width: 14px; height: 14px; cursor: nwse-resize; z-index: 51; }

        /* 👻 Силуэт Aero Snap */
        #snapGhost {
            position: absolute;
            background: rgba(59, 130, 246, 0.15);
            border: 2px dashed rgba(59, 130, 246, 0.65);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            pointer-events: none;
            z-index: 999;
            transition: all 0.12s ease-out;
            display: none;
        }

        /* Меню Пуск (Windows 11 Fluent) */
        #startMenu {
            position: absolute;
            bottom: 56px;
            left: 12px;
            width: 520px;
            max-height: 580px;
            background: rgba(15, 23, 42, 0.97);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 16px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: startMenuIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes startMenuIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 📊 Стилизация Tabulator под Cyber-Slate */
        .tabulator {
            background-color: #030712 !important;
            border: 1px solid #1e293b !important;
            border-radius: 8px;
            font-size: 12px;
            color: #f1f5f9;
        }
        .tabulator .tabulator-header {
            background-color: #0f172a !important;
            color: #94a3b8 !important;
            border-bottom: 2px solid #334155 !important;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .tabulator .tabulator-header .tabulator-col {
            background-color: #0f172a !important;
            border-right: 1px solid #1e293b !important;
        }
        .tabulator .tabulator-row {
            background-color: #030712 !important;
            border-bottom: 1px solid #1e293b !important;
        }
        .tabulator .tabulator-row:nth-child(even) { 
            background-color: #080d1a !important; 
        }
        .tabulator .tabulator-row:hover { 
            background-color: #1e293b !important; 
        }
        .tabulator .tabulator-row.tabulator-selected { 
            background-color: #1e3a8a !important; 
            color: #ffffff !important;
        }
        .tabulator .tabulator-cell {
            padding: 7px 9px !important;
            border-right: 1px solid #1e293b !important;
        }

        /* 🚨 Статусные подсветки ячеек ФЛК */
        .flk-critical { 
            background-color: rgba(220, 38, 38, 0.3) !important; 
            color: #fca5a5 !important; 
            font-weight: bold; 
            border-left: 3px solid #ef4444 !important;
        }
        .flk-warning { 
            background-color: rgba(217, 119, 6, 0.3) !important; 
            color: #fcd34d !important; 
            border-left: 3px solid #f59e0b !important;
        }
        .flk-info { 
            background-color: rgba(2, 132, 199, 0.25) !important; 
            color: #7dd3fc !important; 
        }

        /* Тонкие полосы прокрутки */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Пульсирующий индикатор готовности */
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(1.04); }
        }
        .pulse-led { animation: pulse-glow 2s infinite ease-in-out; }

        /* ========================================================================= */
        /* КРОССПЛАТФОРМЕННЫЕ СТИЛИ (macOS, Windows, Linux)                          */
        /* ========================================================================= */

        /* Высококачественное сглаживание шрифтов на Retina и 4K экранах */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            touch-action: manipulation;
        }

        /* Плавные жесты панорамирования для трекпадов Mac, Win Precision и сенсорных экранов */
        #tabulatorGridContainer, .tabulator-tableholder {
            touch-action: pan-x pan-y !important;
            -webkit-overflow-scrolling: touch !important;
            overscroll-behavior: contain;
        }

        /* 🍎 СТИЛЬ macOS (Apple Cupertino) */
        .os-mode-macos .win-header {
            flex-direction: row-reverse !important;
            padding-left: 14px !important;
            padding-right: 14px !important;
        }
        .os-mode-macos .win-header > div:last-child {
            display: flex !important;
            gap: 7px !important;
            align-items: center !important;
        }
        .os-mode-macos .win-btn-close {
            width: 12px !important;
            height: 12px !important;
            border-radius: 9999px !important;
            background-color: #ff5f56 !important;
            border: 1px solid #e0443e !important;
            color: transparent !important;
            order: 1 !important;
            font-size: 8px !important;
            line-height: 1 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: all 0.15s ease;
        }
        .os-mode-macos .win-btn-close:hover {
            color: rgba(0, 0, 0, 0.75) !important;
            filter: brightness(1.08);
        }
        .os-mode-macos .win-btn-min {
            width: 12px !important;
            height: 12px !important;
            border-radius: 9999px !important;
            background-color: #ffbd2e !important;
            border: 1px solid #dea123 !important;
            color: transparent !important;
            order: 2 !important;
            font-size: 8px !important;
            line-height: 1 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: all 0.15s ease;
        }
        .os-mode-macos .win-btn-min:hover {
            color: rgba(0, 0, 0, 0.75) !important;
            filter: brightness(1.08);
        }
        .os-mode-macos .win-btn-max {
            width: 12px !important;
            height: 12px !important;
            border-radius: 9999px !important;
            background-color: #27c93f !important;
            border: 1px solid #1aab29 !important;
            color: transparent !important;
            order: 3 !important;
            font-size: 8px !important;
            line-height: 1 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: all 0.15s ease;
        }
        .os-mode-macos .win-btn-max:hover {
            color: rgba(0, 0, 0, 0.75) !important;
            filter: brightness(1.08);
        }
        .os-mode-macos .os-window {
            border-radius: 12px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
        }
        .os-mode-macos #taskbar {
            border-radius: 20px;
            margin: 0 16px 10px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        /* 🐧 СТИЛЬ Linux (GNOME / KDE Plasma) */
        .os-mode-linux .os-window {
            border-radius: 8px;
            border: 1px solid #334155;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
        }
        .os-mode-linux .win-header {
            background-color: #111827 !important;
            border-bottom: 1px solid #1f2937 !important;
        }
        .os-mode-linux .win-btn-close {
            background-color: #374151;
            border-radius: 6px;
        }
        .os-mode-linux .win-btn-close:hover {
            background-color: #dc2626 !important;
        }

        /* 🪟 СТИЛЬ Windows 11 (Fluent) */
        .os-mode-windows .os-window {
            border-radius: 10px;
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.8);
        }
        .os-mode-windows .win-btn-close:hover {
            background-color: #e81123 !important;
            color: white !important;
        }
</head>
<body class="h-full w-full overflow-hidden text-slate-100 flex flex-col desktop-canvas">

    <!-- ========================================================================= -->
    <!-- 1. ПОВЕРХНОСТЬ РАБОЧЕГО СТОЛА (DESKTOP AREA С ПЕРЕТАСКИВАЕМЫМИ ЯРЛЫКАМИ)   -->
    <!-- ========================================================================= -->
    <main id="desktopArea" class="flex-1 relative overflow-hidden p-6">
        
        <!-- Силуэт Aero Snap -->
        <div id="snapGhost"></div>

        <!-- Ярлыки рабочего стола (Свободно перемещаются мышью и пальцем) -->
        <div id="desktopIconsLayer" class="relative w-full h-full pointer-events-none z-0">
            
            <div data-app="winEditor" class="desktop-icon pointer-events-auto absolute flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-24 text-center cursor-pointer" style="left: 16px; top: 16px;">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 flex items-center justify-center text-2xl shadow-lg shadow-blue-500/30">📄</div>
                <span class="text-xs font-semibold text-white drop-shadow">Накладная</span>
            </div>

            <div data-app="winSchema" class="desktop-icon pointer-events-auto absolute flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-24 text-center cursor-pointer" style="left: 16px; top: 112px;">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-600 to-teal-400 flex items-center justify-center text-2xl shadow-lg shadow-emerald-500/30">📐</div>
                <span class="text-xs font-semibold text-white drop-shadow">Конструктор</span>
            </div>

            <div data-app="winDb" class="desktop-icon pointer-events-auto absolute flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-24 text-center cursor-pointer" style="left: 16px; top: 208px;">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 via-pink-600 to-rose-500 flex items-center justify-center text-2xl shadow-lg shadow-purple-500/30">🗄️</div>
                <span class="text-xs font-semibold text-white drop-shadow">СУБД ERP</span>
            </div>

            <div data-app="winReconcile" class="desktop-icon pointer-events-auto absolute flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-24 text-center cursor-pointer" style="left: 16px; top: 304px;">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-600 via-orange-600 to-yellow-500 flex items-center justify-center text-2xl shadow-lg shadow-amber-500/30">⚖️</div>
                <span class="text-xs font-semibold text-white drop-shadow">Сверка</span>
            </div>

            <div data-app="winKb" class="desktop-icon pointer-events-auto absolute flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-24 text-center cursor-pointer" style="left: 16px; top: 400px;">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center text-2xl shadow-lg shadow-cyan-500/30">📚</div>
                <span class="text-xs font-semibold text-white drop-shadow">База Знаний</span>
            </div>

            <div data-app="winWizard" class="desktop-icon pointer-events-auto absolute flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-24 text-center cursor-pointer" style="left: 120px; top: 16px;">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-500 to-emerald-500 flex items-center justify-center text-2xl shadow-lg shadow-blue-500/30">🚀</div>
                <span class="text-xs font-semibold text-white drop-shadow">Мастер 2.0</span>
            </div>

            <div data-app="winInspector" class="desktop-icon pointer-events-auto absolute flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-24 text-center cursor-pointer" style="left: 120px; top: 112px;">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-violet-600 to-purple-600 flex items-center justify-center text-2xl shadow-lg shadow-purple-500/30">🛠️</div>
                <span class="text-xs font-semibold text-white drop-shadow">Инспектор</span>
            </div>

            <div data-app="winSettings" class="desktop-icon pointer-events-auto absolute flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/10 transition-colors w-24 text-center cursor-pointer" style="left: 120px; top: 208px;">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-slate-600 to-slate-800 flex items-center justify-center text-2xl shadow-lg shadow-slate-500/30">⚙️</div>
                <span class="text-xs font-semibold text-white drop-shadow">Настройки</span>
            </div>

        </div>

        <!-- ===================================================================== -->
        <!-- ОКНО 1: РЕДАКТОР НАКЛАДНОЙ (MAIN EDI GRID VIEW)                       -->
        <!-- ===================================================================== -->
        <div id="winEditor" class="os-window" style="top: 16px; left: 240px; width: 1120px; height: 640px; z-index: 10;">
            <div class="win-header px-4 py-2.5 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <span class="text-sm">📄</span>
                    <span class="font-bold text-xs text-white">Редактор Накладной — PharmaGate EDI Grid</span>
                    <span id="winEditorFileBadge" class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-mono text-[10px] border border-blue-500/30">Накладная_№407.dbf</span>
                </div>
                <div class="flex items-center gap-1">
                    <button class="win-btn-min w-6 h-6 rounded hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white text-xs">_</button>
                    <button class="win-btn-max w-6 h-6 rounded hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white text-xs">□</button>
                    <button class="win-btn-close w-6 h-6 rounded hover:bg-red-600 flex items-center justify-center text-slate-400 hover:text-white text-xs font-bold">✕</button>
                </div>
            </div>

            <!-- Тулбар окна накладной -->
            <div class="bg-[#0b0f19] border-b border-slate-800 px-3 py-1.5 flex items-center justify-between gap-2 text-xs shrink-0 flex-wrap">
                <div class="flex items-center gap-1.5 flex-wrap">
                    <input type="file" id="fileInput" class="hidden" accept=".dbf,.xlsx,.xls,.json,.csv,.xml,.accdb,.mdb">
                    <button id="btnOpenFile" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-200 border border-slate-700 font-semibold flex items-center gap-1 cursor-pointer">
                        <span>📂</span> Открыть <span id="kbdOpenHint" class="text-[10px] text-slate-400 font-mono ml-0.5">Ctrl+O</span>
                    </button>
                    <button id="btnOpenCreateWizard" class="px-2.5 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-white font-semibold flex items-center gap-1 cursor-pointer shadow-sm">
                        <span>🚀</span> Создать
                    </button>
                    <button id="btnAutoRepair" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-white font-semibold flex items-center gap-1 cursor-pointer shadow-sm">
                        <span>⚡</span> Авто-Ремонт 99%
                    </button>
                    <button id="btnLoadDemoInvoice" class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-white font-semibold flex items-center gap-1 cursor-pointer shadow-sm" title="Сгенерировать реалистичную фарм-накладную 50 позиций с проверкой ФЛК">
                        <span>🎲</span> Демо
                    </button>
                    <div class="h-4 w-px bg-slate-700 mx-1"></div>
                    <button id="btnSaveDbf" class="px-2.5 py-1.5 bg-teal-600 hover:bg-teal-500 rounded-lg text-white font-semibold cursor-pointer shadow-sm flex items-center gap-1">
                        <span>💾</span> Сохранить <span id="kbdSaveHint" class="text-[10px] text-teal-200 font-mono ml-0.5">Ctrl+S</span>
                    </button>
                    <button id="btnExportTorg12" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 border border-slate-700 cursor-pointer">
                        📄 ТОРГ-12
                    </button>
                    <button id="btnExportUpd" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 border border-slate-700 cursor-pointer">
                        📑 УПД 970@
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <input type="text" id="gridSearchInput" placeholder="🔍 Поиск (название, код)..." class="bg-[#030712] border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 w-44">
                    <button id="btnVat10" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300 cursor-pointer" title="Установить НДС 10%">10%</button>
                    <button id="btnVat0" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300 cursor-pointer" title="Установить 0% НДС">0%</button>
                    <button id="btnCopyTsv" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200 font-bold cursor-pointer flex items-center gap-1" title="Скопировать для Microsoft Excel, Apple Numbers или LibreOffice Calc">
                        <span>📋</span> Таблица <span id="kbdCopyHint" class="text-[10px] text-slate-400 font-mono">TSV</span>
                    </button>

                            <select id="settingEncoding" class="w-full bg-[#030712] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
                                <option value="cp866">DOS CP866 (0x26) — Фарм-стандарт РФ</option>
                                <option value="windows-1251">Windows-1251 (0x25) — 1C / ANSI</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">Масштаб отображения:</label>
                            <div class="flex items-center gap-1.5">
                                <button id="btnSettingZoomMinus" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200 font-bold text-xs">-</button>
                                <span id="settingZoomDisplay" class="px-2 py-1 bg-[#030712] border border-slate-800 rounded font-mono text-center text-xs flex-1">100%</span>
                                <button id="btnSettingZoomPlus" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200 font-bold text-xs">+</button>
                                <button id="btnSettingZoomReset" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-400 text-xs">100%</button>
                            </div>
                        </div>
                    </div>

                    <div class="pt-1 flex items-center justify-between border-t border-slate-800/80">
                        <label class="flex items-center gap-2 text-slate-300 cursor-pointer">
                            <input type="checkbox" id="settingSoundFx" class="rounded text-blue-600">
                            <span>🔔 Звуковые эффекты интерфейса (Web Audio API)</span>
                        </label>
                        <button id="btnSettingDemo50" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-white font-semibold text-xs flex items-center gap-1">
                            <span>🎲</span> Тест-накладная 50 строк
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- ========================================================================= -->
    <!-- 2. МЕНЮ ПУСК (WINDOWS 11 FLUENT FLYOUT)                                   -->
    <!-- ========================================================================= -->
    <div id="startMenu">
        <!-- Поиск в меню Пуск -->
        <div class="p-4 border-b border-slate-800">
            <input type="text" id="startSearchInput" placeholder="🔍 Поиск приложений, настроек и документов..." class="w-full bg-[#090d16] border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
        </div>

        <!-- Закрепленные приложения -->
        <div class="p-4 flex-1 overflow-y-auto">
            <div class="text-[11px] font-bold text-slate-400 mb-3 uppercase tracking-wider">Закрепленные приложения</div>
            <div class="grid grid-cols-4 gap-3 text-center text-xs">
                <button onclick="window.PharmaGate.openApp('winEditor'); window.PharmaGate.toggleStartMenu();" class="flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-slate-800/80 transition-colors">
                    <div class="w-10 h-10 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 flex items-center justify-center text-xl">📄</div>
                    <span class="text-[11px] text-slate-200">Накладная</span>
                </button>
                <button onclick="window.PharmaGate.openApp('winSchema'); window.PharmaGate.toggleStartMenu();" class="flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-slate-800/80 transition-colors">
                    <div class="w-10 h-10 rounded-xl bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-xl">📐</div>
                    <span class="text-[11px] text-slate-200">Конструктор</span>
                </button>
                <button onclick="window.PharmaGate.openApp('winDb'); window.PharmaGate.toggleStartMenu();" class="flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-slate-800/80 transition-colors">
                    <div class="w-10 h-10 rounded-xl bg-purple-600/20 text-purple-400 border border-purple-500/30 flex items-center justify-center text-xl">🗄️</div>
                    <span class="text-[11px] text-slate-200">СУБД ERP</span>
                </button>
                <button onclick="window.PharmaGate.openApp('winReconcile'); window.PharmaGate.toggleStartMenu();" class="flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-slate-800/80 transition-colors">
                    <div class="w-10 h-10 rounded-xl bg-amber-600/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-xl">⚖️</div>
                    <span class="text-[11px] text-slate-200">Сверка</span>
                </button>
                <button onclick="window.PharmaGate.openApp('winKb'); window.PharmaGate.toggleStartMenu();" class="flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-slate-800/80 transition-colors">
                    <div class="w-10 h-10 rounded-xl bg-cyan-600/20 text-cyan-400 border border-cyan-500/30 flex items-center justify-center text-xl">📚</div>
                    <span class="text-[11px] text-slate-200">База Знаний</span>
                </button>
                <button onclick="window.PharmaGate.openApp('winWizard'); window.PharmaGate.toggleStartMenu();" class="flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-slate-800/80 transition-colors">
                    <div class="w-10 h-10 rounded-xl bg-blue-500/20 text-blue-300 border border-blue-400/30 flex items-center justify-center text-xl">🚀</div>
                    <span class="text-[11px] text-slate-200">Мастер 2.0</span>
                </button>
                <button onclick="window.PharmaGate.openApp('winInspector'); window.PharmaGate.toggleStartMenu();" class="flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-slate-800/80 transition-colors">
                    <div class="w-10 h-10 rounded-xl bg-violet-600/20 text-violet-300 border border-violet-400/30 flex items-center justify-center text-xl">🛠️</div>
                    <span class="text-[11px] text-slate-200">Инспектор</span>
                </button>
                <button onclick="window.PharmaGate.openApp('winSettings'); window.PharmaGate.toggleStartMenu();" class="flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-slate-800/80 transition-colors">
                    <div class="w-10 h-10 rounded-xl bg-slate-600/20 text-slate-300 border border-slate-500/30 flex items-center justify-center text-xl">⚙️</div>
                    <span class="text-[11px] text-slate-200">Настройки</span>
                </button>
            </div>
        </div>

        <!-- Нижняя панель пользователя в меню Пуск -->
        <div class="p-3 bg-[#090d16] border-t border-slate-800 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-[11px]">AT</div>
                <div class="font-bold text-white">Alexander Talents Agency</div>
            </div>
            <button onclick="location.reload()" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white" title="Перезагрузить систему">🔄</button>
        </div>
    </div>

    <!-- ========================================================================= -->
    <!-- 3. ПАНЕЛЬ ЗАДАЧ (CROSS-PLATFORM TASKBAR & DOCK)                            -->
    <!-- ========================================================================= -->
    <footer id="taskbar" class="h-12 bg-slate-950/95 backdrop-blur-2xl border-t border-slate-800/90 px-3 flex items-center justify-between shrink-0 z-50 shadow-2xl transition-all">
        
        <div class="flex items-center gap-2">
            <!-- Кнопка Меню (ОС-адаптивная) -->
            <button onclick="window.PharmaGate.toggleStartMenu()" class="w-8 h-8 rounded-lg bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center text-sm shadow-md shadow-blue-600/30 transition-all cursor-pointer" title="Меню приложений">
                🪟
            </button>

            <!-- Кнопка быстрого поиска Spotlight / Command Palette -->
            <button id="btnOpenSpotlight" class="flex items-center gap-1.5 px-2.5 py-1.5 bg-[#090d16] hover:bg-slate-800 text-slate-300 border border-slate-800 rounded-lg text-xs cursor-pointer transition-colors" title="Открыть Command Palette / Spotlight">
                <span>🔍</span>
                <span class="hidden sm:inline text-[11px] text-slate-400">Поиск</span>
                <span id="kbdSpotlightHint" class="px-1.5 py-0.5 rounded bg-slate-900 text-blue-400 font-mono text-[10px] border border-slate-700">⌘K</span>
            </button>

            <!-- Селектор стратегий компоновки окон -->
            <select id="strategySelect" class="bg-[#090d16] text-slate-300 border border-slate-800 rounded-lg px-2 py-1 text-xs font-semibold focus:outline-none cursor-pointer">
                <option value="cascade">🪟 Каскад</option>
                <option value="split_lr">🪟 Сплит 50/50</option>
                <option value="grid_2x2">🪟 Сетка 2x2</option>
                <option value="focus">🪟 Фокус (Макс)</option>
            </select>

            <div class="h-5 w-px bg-slate-800 mx-0.5 hidden md:block"></div>

            <!-- Иконки активных окон на панели задач -->
            <div id="taskbarAppsContainer" class="flex items-center gap-1.5"></div>
        </div>

        <div class="flex items-center gap-2.5 text-xs font-medium text-slate-400 flex-wrap">
            <!-- HUD индикатор финансовых итогов -->
            <div class="hidden xl:flex items-center gap-3 bg-[#090d16] px-3 py-1 rounded-lg border border-slate-800 font-mono text-[11px]">
                <div>Сумма: <b id="hudTotalSum" class="text-emerald-400">0.00 ₽</b></div>
                <div class="h-3 w-px bg-slate-700"></div>
                <div>Строк: <b id="hudItemsCount" class="text-slate-300">0</b></div>
                <div class="h-3 w-px bg-slate-700"></div>
                <div id="hudReadinessBadge" class="text-emerald-400 font-bold">100% Готов</div>
            </div>

            <!-- Кроссплатформенные селекторы (ОС / Окончания строк / Кодировка) -->
            <div class="flex items-center gap-1 bg-[#090d16] p-1 rounded-lg border border-slate-800 text-[11px]">
                <button id="hudOsBadge" class="px-1.5 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700 text-blue-300 font-semibold cursor-pointer" title="Стиль интерфейса (macOS / Windows / Linux)">
                    🪟 Win
                </button>
                <button id="hudLineEndingBadge" class="px-1.5 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700 text-amber-300 font-mono text-[10px] cursor-pointer" title="Окончания строк: CRLF (Windows) / LF (Linux/Mac)">
                    CRLF
                </button>
                <button id="hudEncBadge" class="px-1.5 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700 text-emerald-300 font-mono text-[10px] cursor-pointer" title="Целевая кодировка DBF (CP866 / CP1251)">
                    CP866
                </button>
            </div>

            <!-- Масштаб и Полный экран -->
            <div class="hidden sm:flex items-center gap-1 bg-[#090d16] px-1.5 py-1 rounded-lg border border-slate-800 text-[11px]">
                <button id="btnZoomMinus" class="w-5 h-5 flex items-center justify-center rounded hover:bg-slate-800 text-slate-300 font-bold" title="Уменьшить масштаб">-</button>
                <span id="hudZoomVal" class="font-mono text-[10px] px-1 text-slate-300">100%</span>
                <button id="btnZoomPlus" class="w-5 h-5 flex items-center justify-center rounded hover:bg-slate-800 text-slate-300 font-bold" title="Увеличить масштаб">+</button>
                <button id="btnToggleFullscreen" class="px-1.5 py-0.5 rounded hover:bg-slate-800 text-slate-300" title="Полноэкранный режим (F11)">⛶</button>
            </div>

            <!-- Звуковые эффекты -->
            <button id="btnToggleSound" class="p-1 rounded-lg bg-[#090d16] border border-slate-800 hover:bg-slate-800 text-xs cursor-pointer" title="Звуковые эффекты">
                🔔
            </button>

            <!-- Селектор целевого шлюза -->
            <div class="hidden lg:flex items-center gap-1 bg-[#090d16] px-2 py-1 rounded-lg border border-slate-800 text-[11px]">
                <span>🎯</span>
                <select id="profileSelect" class="bg-transparent text-emerald-400 font-bold focus:outline-none cursor-pointer">
                    <option value="neofarm" class="bg-slate-900">НЕО-ФАРМ</option>
                    <option value="rigla" class="bg-slate-900">Ригла</option>
                    <option value="katren" class="bg-slate-900">Катрен</option>
                    <option value="pharm366" class="bg-slate-900">36.6</option>
                    <option value="april" class="bg-slate-900">Апрель</option>
                    <option value="universal_1251" class="bg-slate-900">Win-1251</option>
                </select>
            </div>

            <!-- Часы -->
            <div id="systemClock" class="font-mono text-slate-300 font-bold text-xs pl-1">12:00</div>
        </div>
    </footer>

    <!-- ========================================================================= -->
    <!-- 4. SPOTLIGHT & COMMAND PALETTE (⌘K / Ctrl+K)                              -->
    <!-- ========================================================================= -->
    <div id="commandPaletteModal" class="fixed inset-0 z-[100000] bg-slate-950/70 backdrop-blur-md hidden items-start justify-center pt-24 p-4 animate-fadeIn">
        <div class="w-full max-w-xl bg-[#090d16] border border-slate-700/80 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <!-- Поле поиска Command Palette -->
            <div class="p-3.5 border-b border-slate-800 flex items-center gap-3 bg-[#0c1220]">
                <span class="text-lg">🔍</span>
                <input type="text" id="paletteSearchInput" placeholder="Введите команду, имя действия, окна или файла..." class="flex-1 bg-transparent text-white text-sm focus:outline-none placeholder-slate-500 font-medium">
                <span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-[10px] text-slate-400 font-mono">Esc</span>
            </div>

            <!-- Список команд и результатов -->
            <div id="paletteResultsList" class="max-h-96 overflow-y-auto p-2 space-y-1"></div>

            <!-- Нижняя подсказка -->
            <div class="p-2.5 bg-[#060a12] border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400 px-4">
                <div class="flex items-center gap-3">
                    <span><kbd class="px-1.5 py-0.5 rounded bg-slate-800 font-mono text-[10px]">↑</kbd> <kbd class="px-1.5 py-0.5 rounded bg-slate-800 font-mono text-[10px]">↓</kbd> Навигация</span>
                    <span><kbd class="px-1.5 py-0.5 rounded bg-slate-800 font-mono text-[10px]">Enter</kbd> Выбрать</span>
                </div>
                <span>PharmaGate EDI Spotlight</span>
            </div>
        </div>
    </div>

    <!-- Глобальный защитный оверлей Drag-and-Drop (Предотвращает навигацию браузера на file:///) -->
    <div id="dragDropOverlay" class="fixed inset-0 z-[99999] bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center border-4 border-dashed border-blue-500 rounded-2xl m-4 transition-all opacity-0 pointer-events-none duration-150">
        <div class="p-8 bg-slate-900/95 border border-blue-500/60 rounded-3xl shadow-2xl flex flex-col items-center gap-4 text-center max-w-lg pointer-events-none">
            <div class="w-20 h-20 rounded-full bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-4xl shadow-inner animate-pulse">
                📥
            </div>
            <h3 class="text-xl font-bold text-white tracking-wide">Отпустите файл для загрузки</h3>
            <p class="text-xs text-slate-300 leading-relaxed">
                Мгновенный локальный парсинг без отправки во внешнюю сеть:<br>
                <span class="text-blue-400 font-medium">DBF (все кодировки)</span>, <span class="text-emerald-400 font-medium">Excel (.xlsx, .xls)</span>, <span class="text-purple-400 font-medium">XML УПД 970@</span>, <span class="text-amber-400 font-medium">1C JSON</span>, <span class="text-cyan-400 font-medium">CSV</span>, <span class="text-rose-400 font-medium">MS Access (.accdb, .mdb)</span>
            </p>
            <div class="px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700 text-[11px] text-slate-400 font-mono">
                Безопасная обработка в Web Worker / In-Memory
            </div>
        </div>
    </div>

    <!-- Подключение контроллера WebOS -->
    <script type="module" src="js/app.js"></script>
</body>
