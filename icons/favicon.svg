<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="4"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(37, 99, 235, 0.25)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Pharma Cross Core -->
  <g filter="url(#glow)">
    <rect x="216" y="116" width="80" height="280" rx="20" fill="url(#cross)"/>
    <rect x="116" y="216" width="280" height="80" rx="20" fill="url(#cross)"/>
  </g>
  
  <!-- Modern Caduceus / Capsule Accent -->
  <circle cx="256" cy="256" r="48" fill="#0f172a" stroke="url(#accent)" stroke-width="8"/>
  <path d="M 236 256 L 250 270 L 276 242" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand Typography Badge -->
  <rect x="176" y="420" width="160" height="36" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2"/>
  <text x="256" y="444" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="3">PHARMAGATE</text>
</svg>